<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ───────────── TOP BAR ───────────── -->
    <header class="topbar">
      <div class="topbar__left">
        <span id="greeting-text">Good morning</span>
      </div>
      <div class="topbar__right">
        <button id="theme-toggle" class="icon-btn" title="Toggle light/dark mode">
          <span id="theme-icon">☀️</span>
        </button>
      </div>
    </header>

    <main class="dashboard">

      <!-- ───────────── GREETING + CLOCK ───────────── -->
      <section class="card greeting-card">
        <div class="clock-block">
          <div id="clock" class="clock">00:00:00</div>
          <div id="date" class="date">Monday, January 1</div>
        </div>
        <div class="greeting-block">
          <h1 id="greeting-full">Good morning! 👋</h1>
          <!-- Challenge: custom name -->
          <div class="name-row">
            <span id="name-display" class="name-display"></span>
            <button id="edit-name-btn" class="text-btn">✏️ Set name</button>
          </div>
          <div id="name-form" class="name-form hidden">
            <input id="name-input" type="text" placeholder="Enter your name…" maxlength="30" />
            <button id="name-save-btn" class="primary-btn">Save</button>
          </div>
        </div>
      </section>

      <!-- ───────────── FOCUS TIMER ───────────── -->
      <section class="card timer-card">
        <h2 class="card-title">⏱ Focus Timer</h2>

        <!-- Challenge: change Pomodoro time -->
        <div class="timer-settings">
          <label for="timer-minutes">Session length (min):</label>
          <input id="timer-minutes" type="number" min="1" max="120" value="25" />
          <button id="apply-time-btn" class="text-btn">Apply</button>
        </div>

        <div class="timer-display">
          <span id="timer-time">25:00</span>
        </div>
        <div class="timer-progress-wrap">
          <div id="timer-progress" class="timer-progress"></div>
        </div>
        <div class="timer-controls">
          <button id="timer-start" class="primary-btn">Start</button>
          <button id="timer-stop"  class="secondary-btn" disabled>Stop</button>
          <button id="timer-reset" class="secondary-btn">Reset</button>
        </div>
        <p id="timer-status" class="timer-status"></p>
      </section>

      <!-- ───────────── TO-DO LIST ───────────── -->
      <section class="card todo-card">
        <h2 class="card-title">📝 To-Do List</h2>

        <div class="todo-controls">
          <input id="todo-input" type="text" placeholder="Add a new task…" maxlength="100" />
          <button id="todo-add-btn" class="primary-btn">Add</button>
        </div>

        <!-- Challenge: sort tasks -->
        <div class="todo-filter-row">
          <span class="filter-label">Sort:</span>
          <button class="filter-btn active" data-sort="default">Default</button>
          <button class="filter-btn" data-sort="az">A–Z</button>
          <button class="filter-btn" data-sort="done">Done last</button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>
        <p id="todo-empty" class="empty-hint">No tasks yet. Add one above!</p>
      </section>

      <!-- ───────────── QUICK LINKS ───────────── -->
      <section class="card links-card">
        <h2 class="card-title">🔗 Quick Links</h2>

        <div class="link-add-form">
          <input id="link-name-input" type="text"  placeholder="Label (e.g. YouTube)" maxlength="30" />
          <input id="link-url-input"  type="url"   placeholder="https://…" />
          <button id="link-add-btn" class="primary-btn">Add</button>
        </div>

        <div id="links-grid" class="links-grid"></div>
        <p id="links-empty" class="empty-hint">No links saved yet.</p>
      </section>

    </main>

    <script src="js/app.js"></script>
  </body>
</html>
